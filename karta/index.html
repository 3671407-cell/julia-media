.bg:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(7,6,13,.45),rgba(7,6,13,.78))}
main>*{width:100%}main{position:relative;overflow-x:hidden;z-index:1;max-width:560px;margin:0 auto;padding:28px 18px 60px;min-height:100vh;display:flex;flex-direction:column;justify-content:center}
.card{background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:26px;padding:30px 24px;animation:in .7s ease both}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.eyebrow{letter-spacing:.28em;text-transform:uppercase;font-size:11px;color:var(--gold);margin:0 0 14px}
h1,h2,.script{font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-weight:600;margin:0}
h1{font-size:clamp(36px,9vw,50px);line-height:1.05;background:linear-gradient(90deg,#ffd9a0,#f3a6d4,#a9c7ff);-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-size:clamp(28px,7vw,36px);line-height:1.12;margin-bottom:10px}
p{line-height:1.6;color:var(--soft);margin:12px 0}
.keys{display:flex;gap:10px;justify-content:center;margin:0 0 22px}
.k{width:26px;height:26px;opacity:.3;transition:.6s;filter:grayscale(1)}
.k.on{opacity:1;filter:none;transform:scale(1.15);filter:drop-shadow(0 0 8px #ffd9a0)}
textarea,input[type=text],select{width:100%;margin-top:12px;background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:16px;padding:14px 16px;color:var(--ink);font:400 17px/1.5 Manrope,sans-serif;outline:none}
textarea{min-height:110px;resize:vertical}
textarea:focus,input:focus,select:focus{border-color:var(--gold)}
select option{color:#111}
.row{display:flex;gap:10px}.row>*{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--ink);padding:9px 14px;border-radius:999px;font:400 14px Manrope,sans-serif;cursor:pointer;transition:.2s}
.chip:hover,.chip.sel{background:linear-gradient(90deg,#f3a6d4,#a9a2ff);color:#1a1030;border-color:transparent}
.btn{display:inline-block;margin-top:22px;border:0;border-radius:999px;padding:15px 28px;font:600 16px Manrope,sans-serif;color:#1a1030;background:linear-gradient(90deg,#ffd9a0,#f3a6d4,#a9c7ff);cursor:pointer;text-decoration:none;box-shadow:0 8px 30px rgba(243,166,212,.35)}
.btn:disabled{opacity:.35;cursor:default;box-shadow:none}
.ghost{background:none;color:var(--ink);border:1px solid var(--line);box-shadow:none;margin-right:8px}
.hint{font-size:13px;color:var(--soft);opacity:.8;margin-top:10px}
a.link{color:var(--gold);cursor:pointer;text-decoration:underline;font-size:14px}
