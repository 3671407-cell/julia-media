<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Travel Club: покажем, как это устроено</title>
<style>
:root{--bg:#07060d;--tx:#ebe8f7;--mu:#a29cc0;--ln:#2a2640;--ac:#b9a6ff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:300 17px/1.5 -apple-system,"Segoe UI",Roboto,Arial,sans-serif;min-height:100vh}
.w{max-width:560px;margin:0 auto;padding:20px 16px 40px}
.lg{display:flex;gap:8px;justify-content:flex-end}
.lg button{background:none;border:1px solid var(--ln);color:var(--mu);border-radius:20px;padding:4px 12px;font:inherit;font-size:14px;cursor:pointer}
.lg button.on{color:var(--tx);border-color:var(--ac)}
h1{font-weight:300;font-size:26px;line-height:1.25;margin:22px 0 8px}
.sub{color:var(--mu);margin:0 0 18px}
.box{background:#100e1f;border:1px solid var(--ln);border-radius:16px;overflow:hidden}
.timer{padding:34px 16px;text-align:center}
.timer b{display:block;font-size:56px;font-weight:200;letter-spacing:2px}
.timer span{color:var(--mu);font-size:15px}
video{display:block;width:100%;background:#000}
.skip{display:block;margin:12px auto 0;background:none;border:none;color:var(--ac);font:inherit;font-size:15px;cursor:pointer;text-decoration:underline}
.btns{margin-top:22px;display:grid;gap:10px}
.btns a{display:block;text-align:center;text-decoration:none;color:var(--tx);border:1px solid var(--ln);background:#14112a;border-radius:14px;padding:14px 12px}
.btns a.main{background:linear-gradient(90deg,#7a5cff,#d85cc0);border:none}
.hint{color:var(--mu);font-size:14px;text-align:center;margin-top:18px}
.hid{display:none!important}
</style>
</head>
<body>
<div class="w">
  <div class="lg"><button data-l="ru">RU</button><button data-l="en">EN</button><button data-l="tr">TR</button></div>
  <h1 id="t1"></h1>
  <p class="sub" id="t2"></p>
  <div class="box">
    <div class="timer" id="timer"><b id="cnt">3:00</b><span id="t3"></span></div>
    <div id="pl" class="hid"><video id="v" controls playsinline preload="none" poster="../amb-k7q2m9/video/podpiska.jpg"><source src="../amb-k7q2m9/video/podpiska.mp4" type="video/mp4"><track id="trk" kind="subtitles" default></video></div>
  </div>
  <button class="skip" id="skip"></button>
  <div class="btns">
    <a class="main" id="b_tg" target="_blank" rel="noopener"></a>
    <a id="b_vk" target="_blank" rel="noopener"></a>
    <a id="b_ju" target="_blank" rel="noopener"></a>
    <a id="b_wa" target="_blank" rel="noopener" class="hid"></a>
  </div>
  <p class="hint" id="t4"></p>
</div>
<script>
(function(){
  // Адрес счётчика событий (Cloudflare Worker). Пока пусто: события никуда не уходят.
  var EP = "";
  // Номер WhatsApp в формате 79991234567: пока не задан, кнопка скрыта.
  var WA = "79853671407";
  var q = new URLSearchParams(location.search);
  var S = (q.get("s") || "").replace(/[^a-z0-9_]/gi, "").slice(0, 20);
  var T = {
    ru: {t1:"Как устроен клуб путешествий: короткий показ", t2:"Видео на несколько минут: что в клубе и как это работает. Смотрите, когда вам удобно.",
         t3:"Показ начнётся через несколько секунд. Можно смотреть в любое время.", skip:"Смотреть сейчас",
         tg:"Открыть бота в Телеграме и получить подарок", vk:"Написать во ВКонтакте", ju:"Написать Юлии в Телеграме", wa:"Написать в WhatsApp",
         hint:"Выберите удобный мессенджер: везде отвечает Юлия.", sub:""},
    en: {t1:"How the travel club works: a short walkthrough", t2:"A few minutes of video: what the club offers and how it works. Watch whenever it suits you.",
         t3:"The walkthrough starts in a few seconds. You can watch any time.", skip:"Watch now",
         tg:"Open the bot in Telegram and get a gift", vk:"Message on VK", ju:"Message Julia on Telegram", wa:"Message on WhatsApp",
         hint:"Pick the messenger that suits you: Julia answers in all of them.", sub:"en"},
    tr: {t1:"Seyahat kulübü nasıl işler: kısa bir tanıtım", t2:"Birkaç dakikalık video: kulüp neler sunuyor ve nasıl çalışıyor. Size uygun olduğunda izleyin.",
         t3:"Tanıtım birkaç saniye içinde başlar. İstediğiniz zaman izleyebilirsiniz.", skip:"Şimdi izle",
         tg:"Telegram'da botu açın ve hediyenizi alın", vk:"VK'dan yazın", ju:"Yulia'ya Telegram'dan yazın", wa:"WhatsApp'tan yazın",
         hint:"Size uygun mesajlaşma uygulamasını seçin: Yulia hepsinden yanıt verir.", sub:"tr"}
  };
  var L = (q.get("l") || (navigator.language || "ru").slice(0, 2)).toLowerCase();
  if (!T[L]) L = "ru";
  var sent = {};
  function ev(n){ if (sent[n] && /^(page_open|play|video_)/.test(n)) return; sent[n] = 1;
    var d = JSON.stringify({e:n, s:S, l:L, t:Date.now(), p:location.pathname});
    try { if (EP && navigator.sendBeacon) navigator.sendBeacon(EP, d); } catch(e){}
    try { window.__events = (window.__events || []).concat([n]); } catch(e){} }
  function $(i){ return document.getElementById(i); }
  function setL(l){
    L = l; var x = T[l]; document.documentElement.lang = l;
    $("t1").textContent = x.t1; $("t2").textContent = x.t2; $("t3").textContent = x.t3; $("skip").textContent = x.skip; $("t4").textContent = x.hint;
    var st = S ? "?start=" + S : "";
    $("b_tg").textContent = x.tg; $("b_tg").href = "https://t.me/Travel_threads_bot" + st;
    $("b_vk").textContent = x.vk; $("b_vk").href = "https://vk.me/club241191251";
    $("b_ju").textContent = x.ju; $("b_ju").href = "https://t.me/IuliiaZharkova";
    if (WA) { $("b_wa").textContent = x.wa; $("b_wa").href = "https://wa.me/" + WA; $("b_wa").classList.remove("hid"); }
    var tr = $("trk"); if (x.sub) { tr.src = "../amb-k7q2m9/video/subs/podpiska." + x.sub + ".vtt"; tr.srclang = x.sub; tr.label = l.toUpperCase(); } else { tr.removeAttribute("src"); }
    [].forEach.call(document.querySelectorAll(".lg button"), function(b){ b.classList.toggle("on", b.dataset.l === l); });
  }
  [].forEach.call(document.querySelectorAll(".lg button"), function(b){ b.onclick = function(){ setL(b.dataset.l); ev("lang_" + b.dataset.l); }; });
  setL(L);
  ev("page_open");
  var left = 8, shown = false;
  function show(){ if (shown) return; shown = true; clearInterval(iv); $("timer").classList.add("hid"); $("skip").classList.add("hid"); $("pl").classList.remove("hid"); ev("player_shown"); }
  $("cnt").textContent = "0:0" + left; ev("timer_start");
  var iv = setInterval(function(){ left--; if (left <= 0) { show(); } else { $("cnt").textContent = "0:0" + left; } }, 1000);
  $("skip").onclick = function(){ ev("skip_timer"); show(); };
  var v = $("v"), marks = {25:0, 50:0, 75:0};
  v.addEventListener("play", function(){ ev("play"); });
  v.addEventListener("timeupdate", function(){ if (!v.duration) return; var p = v.currentTime / v.duration * 100; [25,50,75].forEach(function(m){ if (p >= m && !marks[m]) { marks[m] = 1; ev("video_" + m); } }); });
  v.addEventListener("ended", function(){ ev("video_100"); });
  [["b_tg","click_bot"],["b_vk","click_vk"],["b_ju","click_julia"],["b_wa","click_wa"]].forEach(function(p){ $(p[0]).addEventListener("click", function(){ ev(p[1]); }); });
})();
</script>
</body>
</html>
